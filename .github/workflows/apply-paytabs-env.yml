name: Apply PayTabs Env

on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: SSH setup
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 10 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Write PayTabs keys and restart
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          PAYTABS_PROFILE_ID: ${{ secrets.PAYTABS_PROFILE_ID }}
          PAYTABS_SERVER_KEY: ${{ secrets.PAYTABS_SERVER_KEY }}
          PAYTABS_CLIENT_KEY: ${{ secrets.PAYTABS_CLIENT_KEY }}
        run: |
          set -euo pipefail
          test -n "$PAYTABS_PROFILE_ID"
          test -n "$PAYTABS_SERVER_KEY"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            PAYTABS_PROFILE_ID="$PAYTABS_PROFILE_ID" \
            PAYTABS_SERVER_KEY="$PAYTABS_SERVER_KEY" \
            PAYTABS_CLIENT_KEY="${PAYTABS_CLIENT_KEY:-}" \
            'bash -s' <<'EOF'
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          def upsert(path: Path, vals: dict):
              path.parent.mkdir(parents=True, exist_ok=True)
              lines = path.read_text().splitlines() if path.exists() else []
              out, seen = [], set()
              for line in lines:
                  if "=" in line and not line.strip().startswith("#"):
                      k = line.split("=", 1)[0].strip()
                      if k in vals:
                          if vals[k] != "" or k != "PAYTABS_CLIENT_KEY":
                              out.append(f"{k}={vals[k]}")
                          else:
                              out.append(line)
                          seen.add(k)
                          continue
                  out.append(line)
              for k, v in vals.items():
                  if k not in seen and v != "":
                      out.append(f"{k}={v}")
              path.write_text("\n".join(out) + "\n")
              path.chmod(0o600)
              print("updated", path)

          common = {
              "PAYTABS_PROFILE_ID": os.environ["PAYTABS_PROFILE_ID"],
              "PAYTABS_SERVER_KEY": os.environ["PAYTABS_SERVER_KEY"],
              "PAYTABS_CLIENT_KEY": os.environ.get("PAYTABS_CLIENT_KEY") or "",
              "PAYTABS_REGION": "JOR",
              "PAYTABS_BASE_URL": "https://secure-jordan.paytabs.com",
          }
          upsert(Path("/var/www/abualnus/apps/api/.env"), {
              **common,
              "API_URL": "https://api.mawjood.online",
              "STOREFRONT_URL": "https://mawjood.online",
          })
          st = Path("/var/www/mawjood-staging/apps/api/.env")
          if st.parent.exists():
              upsert(st, {
                  **common,
                  "API_URL": "https://api.staging.mawjood.online",
                  "STOREFRONT_URL": "https://staging.mawjood.online",
              })
          PY

          cd /var/www/abualnus/apps/api && npx prisma migrate deploy || true
          if [ -d /var/www/mawjood-staging/apps/api ]; then
            cd /var/www/mawjood-staging/apps/api && npx prisma migrate deploy || true
          fi

          cd /var/www/abualnus
          pm2 delete abualnus-api || true
          pm2 start deploy/ecosystem.config.cjs
          for i in $(seq 1 15); do curl -fsS http://127.0.0.1:4000/api/v1/health >/dev/null 2>&1 && break; sleep 2; done
          curl -fsS http://127.0.0.1:4000/api/v1/health; echo

          if [ -d /var/www/mawjood-staging ]; then
            cd /var/www/mawjood-staging
            pm2 delete mawjood-api-staging || true
            pm2 start deploy/ecosystem.staging.config.cjs
            for i in $(seq 1 15); do curl -fsS http://127.0.0.1:4001/api/v1/health >/dev/null 2>&1 && break; sleep 2; done
            curl -fsS http://127.0.0.1:4001/api/v1/health || true; echo
          fi
          pm2 save
          cd /var/www/abualnus/apps/api
          node -e "require('dotenv').config(); console.log('meps', !!(process.env.PAYTABS_PROFILE_ID && process.env.PAYTABS_SERVER_KEY));"
          echo APPLY_PAYTABS_DONE
          EOF
