name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: Install & build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build packages
        run: |
          npm run build -w @half-dinar/shared
          npm run build -w @half-dinar/api
          npm run build -w @half-dinar/storefront
          npm run build -w @half-dinar/admin
        env:
          # Build-time placeholders (production keys live on the VPS)
          VITE_STRIPE_PUBLISHABLE_KEY: pk_test_ci_placeholder
