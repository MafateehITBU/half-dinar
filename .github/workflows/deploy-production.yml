name: Deploy production VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Prefer accept-new over keyscan (keyscan can fail intermittently on some VPS firewalls)
          ssh-keyscan -T 10 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 "root@${DEPLOY_HOST}" 'echo ssh_ok' || \
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 "${{ secrets.DEPLOY_USER }}@${DEPLOY_HOST}" 'echo ssh_ok'

      - name: Sync code to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude '**/node_modules/' \
            --exclude '**/dist/' \
            --exclude 'apps/api/.env' \
            --exclude 'apps/storefront/.env' \
            --exclude 'apps/admin/.env' \
            --exclude 'deploy/.env.infra' \
            --exclude '.env' \
            --exclude '.cursor/' \
            --exclude 'agent-transcripts/' \
            --exclude 'policy/' \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:/var/www/abualnus/"

      - name: Upsert PayTabs env on server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          PAYTABS_PROFILE_ID: ${{ secrets.PAYTABS_PROFILE_ID }}
          PAYTABS_SERVER_KEY: ${{ secrets.PAYTABS_SERVER_KEY }}
          PAYTABS_CLIENT_KEY: ${{ secrets.PAYTABS_CLIENT_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${PAYTABS_PROFILE_ID:-}" ] || [ -z "${PAYTABS_SERVER_KEY:-}" ]; then
            echo "PAYTABS secrets missing — card payments will stay disabled"
            exit 0
          fi
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            PAYTABS_PROFILE_ID="$PAYTABS_PROFILE_ID" \
            PAYTABS_SERVER_KEY="$PAYTABS_SERVER_KEY" \
            PAYTABS_CLIENT_KEY="${PAYTABS_CLIENT_KEY:-}" \
            bash -s <<'REMOTE'
          set -euo pipefail
          file=/var/www/abualnus/apps/api/.env
          touch "$file"; chmod 600 "$file"
          python3 - "$file" <<'PY'
import os, sys
from pathlib import Path
path = Path(sys.argv[1])
vals = {
  'PAYTABS_PROFILE_ID': os.environ['PAYTABS_PROFILE_ID'],
  'PAYTABS_SERVER_KEY': os.environ['PAYTABS_SERVER_KEY'],
  'PAYTABS_CLIENT_KEY': os.environ.get('PAYTABS_CLIENT_KEY') or '',
  'PAYTABS_REGION': 'JOR',
  'PAYTABS_BASE_URL': 'https://secure-jordan.paytabs.com',
  'API_URL': 'https://api.mawjood.online',
  'STOREFRONT_URL': 'https://mawjood.online',
}
lines = path.read_text().splitlines() if path.exists() else []
out, seen = [], set()
for line in lines:
    if '=' in line and not line.strip().startswith('#'):
        k = line.split('=', 1)[0].strip()
        if k in vals:
            if vals[k] != '' or k != 'PAYTABS_CLIENT_KEY':
                out.append(f'{k}={vals[k]}')
            else:
                out.append(line)
            seen.add(k)
            continue
    out.append(line)
for k, v in vals.items():
    if k not in seen and v != '':
        out.append(f'{k}={v}')
path.write_text('\n'.join(out) + '\n')
print('PayTabs env upserted')
PY
          REMOTE

      - name: Remote build & reload
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'bash /var/www/abualnus/deploy/remote-deploy.sh'
