name: Patch PayTabs Nginx

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 10 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Fix PayTabs return POST (named location rewrite)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          block_prod = '''
              # PayTabs POSTs to return URL; SPA would 405. POST → API bridge; GET → SPA.
              location = /checkout/meps/return {
                  error_page 418 = @paytabs_return_post;
                  if ($request_method = POST) {
                      return 418;
                  }
                  try_files /index.html =404;
                  add_header Cache-Control "no-store, no-cache, must-revalidate";
              }

              location @paytabs_return_post {
                  rewrite ^ /api/v1/checkout/meps/return break;
                  proxy_pass http://abualnus_api;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_set_header Connection "";
              }
          '''

          block_staging = block_prod.replace(
              'proxy_pass http://abualnus_api;',
              'proxy_pass http://127.0.0.1:4001;',
          )

          root = Path('/etc/nginx/sites-enabled')
          for path in sorted(root.iterdir()):
              if not path.is_file():
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              name = path.name.lower()
              if any(x in name for x in ('dashboard', 'api.', 'admin')):
                  continue
              if not any(h in text for h in ('mawjood.online', 'abualnus.com', 'staging.mawjood')):
                  continue
              # Remove any previous broken paytabs blocks
              text = re.sub(
                  r'\n\s*# PayTabs POSTs[\s\S]*?location @paytabs_return_post\s*\{[\s\S]*?\n\s*\}\n',
                  '\n',
                  text,
                  count=1,
              )
              text = re.sub(
                  r'\n\s*location = /checkout/meps/return\s*\{[\s\S]*?\n\s*\}\n\s*location @paytabs_return_post\s*\{[\s\S]*?\n\s*\}\n',
                  '\n',
                  text,
                  count=1,
              )
              insert = block_staging if ('staging' in text or '4001' in text) else block_prod
              m = re.search(r'\n\s*location\s+/\s*\{', text)
              if not m:
                  print('no location / in', path)
                  continue
              text = text[: m.start()] + '\n' + insert + text[m.start() :]
              path.write_text(text, encoding='utf-8')
              print('patched', path)
          PY
          nginx -t
          systemctl reload nginx
          echo PATCH_OK
          curl -sS -o /dev/null -w "local_post:%{http_code} redirect=%{redirect_url}\n" \
            -X POST 'http://127.0.0.1/checkout/meps/return' \
            -H 'Host: mawjood.online' \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            -d 'cart_id=nginx-test&respStatus=A' || true
          REMOTE
