name: Patch PayTabs Nginx
on: workflow_dispatch
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 10 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
      - name: Inspect and patch
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          echo '=== sites ==='
          ls -la /etc/nginx/sites-enabled/ || true
          for f in /etc/nginx/sites-enabled/*; do
            echo "---- $f ----"
            rg -n "server_name|location /api|checkout/meps|listen " "$f" | head -40 || true
          done
          python3 - <<'PY'
from pathlib import Path
import re
snippet = '''
    location = /checkout/meps/return {
        error_page 418 = @paytabs_return_post;
        if ($request_method = POST) { return 418; }
        try_files /index.html =404;
    }
    location @paytabs_return_post {
        proxy_pass UPSERT_UPSTREAM;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
'''
root = Path('/etc/nginx/sites-enabled')
for path in sorted(root.iterdir()):
    text = path.read_text(encoding='utf-8', errors='ignore')
    if 'checkout/meps/return' in text:
        print('already', path); continue
    if not any(x in text for x in ('server_name mawjood.online', 'server_name staging.mawjood', 'server_name abualnus.com', 'www.mawjood.online', 'www.abualnus.com')):
        continue
    if 'dashboard' in path.name or path.name.startswith('api') or 'admin' in path.name:
        continue
    upstream = 'http://127.0.0.1:4001/api/v1/checkout/meps/return' if 'staging' in text else 'http://abualnus_api/api/v1/checkout/meps/return'
    if 'abualnus_api' not in text and '4000' in text:
        upstream = 'http://127.0.0.1:4000/api/v1/checkout/meps/return'
    block = snippet.replace('UPSERT_UPSTREAM', upstream)
    # insert before first "location / {" 
    m = re.search(r'\n\s*location\s+/\s*\{', text)
    if not m:
        print('no location /', path); continue
    text2 = text[:m.start()] + '\n' + block + text[m.start():]
    path.write_text(text2, encoding='utf-8')
    print('patched', path, '->', upstream)
PY
          nginx -t
          systemctl reload nginx
          echo PATCH_DONE
          curl -sS -o /dev/null -w "post_old:%{http_code} %{redirect_url}\n" -X POST 'http://127.0.0.1/checkout/meps/return' -H 'Host: mawjood.online' -H 'Content-Type: application/x-www-form-urlencoded' -d 'cart_id=test&respStatus=A' || true
          REMOTE
