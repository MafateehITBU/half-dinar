name: Restart APIs

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 10 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Upsert PayTabs env (if secrets present)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          PAYTABS_PROFILE_ID: ${{ secrets.PAYTABS_PROFILE_ID }}
          PAYTABS_SERVER_KEY: ${{ secrets.PAYTABS_SERVER_KEY }}
          PAYTABS_CLIENT_KEY: ${{ secrets.PAYTABS_CLIENT_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${PAYTABS_PROFILE_ID:-}" ] || [ -z "${PAYTABS_SERVER_KEY:-}" ]; then
            echo "PAYTABS secrets not set — skipping env upsert"
            exit 0
          fi
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            PAYTABS_PROFILE_ID="$PAYTABS_PROFILE_ID" \
            PAYTABS_SERVER_KEY="$PAYTABS_SERVER_KEY" \
            PAYTABS_CLIENT_KEY="${PAYTABS_CLIENT_KEY:-}" \
            bash -s <<'REMOTE'
          set -euo pipefail
          upsert_kv() {
            local file="$1" key="$2" value="$3"
            touch "$file"; chmod 600 "$file"
            python3 - "$file" "$key" "$value" <<'PY'
import sys
from pathlib import Path
path, key, value = Path(sys.argv[1]), sys.argv[2], sys.argv[3]
lines = path.read_text().splitlines() if path.exists() else []
out, found = [], False
for line in lines:
    if line.startswith(key + '='):
        out.append(f'{key}={value}'); found = True
    else:
        out.append(line)
if not found:
    out.append(f'{key}={value}')
path.write_text('\n'.join(out) + '\n')
PY
            chmod 600 "$file"
          }
          apply() {
            local file="$1" api="$2" store="$3"
            upsert_kv "$file" PAYTABS_PROFILE_ID "$PAYTABS_PROFILE_ID"
            upsert_kv "$file" PAYTABS_SERVER_KEY "$PAYTABS_SERVER_KEY"
            [ -n "${PAYTABS_CLIENT_KEY:-}" ] && upsert_kv "$file" PAYTABS_CLIENT_KEY "$PAYTABS_CLIENT_KEY"
            upsert_kv "$file" PAYTABS_REGION JOR
            upsert_kv "$file" PAYTABS_BASE_URL https://secure-jordan.paytabs.com
            upsert_kv "$file" API_URL "$api"
            upsert_kv "$file" STOREFRONT_URL "$store"
            echo "Updated $file"
            grep -E '^PAYTABS_' "$file" | sed -E 's/(KEY|SECRET)=.+/\1=***/'
          }
          apply /var/www/abualnus/apps/api/.env https://api.mawjood.online https://mawjood.online
          [ -f /var/www/mawjood-staging/apps/api/.env ] && \
            apply /var/www/mawjood-staging/apps/api/.env https://api.staging.mawjood.online https://staging.mawjood.online
          REMOTE

      - name: Diagnose and restart APIs
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          echo "=== PM2 before ==="
          pm2 status || true

          echo "=== Docker ==="
          docker ps --format 'table {{.Names}}\t{{.Status}}' || true

          echo "=== Prod API recent logs ==="
          pm2 logs abualnus-api --lines 80 --nostream || true

          echo "=== Staging API recent logs ==="
          pm2 logs mawjood-api-staging --lines 40 --nostream || true

          echo "=== Ensure infra up ==="
          cd /var/www/abualnus
          docker compose -f docker-compose.prod.yml --env-file deploy/.env.infra up -d || true
          if [ -f /var/www/mawjood-staging/docker-compose.staging.yml ]; then
            cd /var/www/mawjood-staging
            docker compose -f docker-compose.staging.yml --env-file deploy/.env.staging.infra up -d || true
          fi

          # Apply MEPS migration if present
          if [ -d /var/www/abualnus/apps/api ]; then
            cd /var/www/abualnus/apps/api
            npx prisma migrate deploy || true
          fi
          if [ -d /var/www/mawjood-staging/apps/api ]; then
            cd /var/www/mawjood-staging/apps/api
            npx prisma migrate deploy || true
          fi

          echo "=== Restart prod API ==="
          cd /var/www/abualnus
          # Prefer delete+start so crash loops clear
          pm2 delete abualnus-api || true
          pm2 start deploy/ecosystem.config.cjs
          sleep 3
          if ! curl -fsS http://127.0.0.1:4000/api/v1/health; then
            echo
            echo "Prod still unhealthy — last error log:"
            pm2 logs abualnus-api --err --lines 60 --nostream || true
            # Try running once in foreground for stderr
            cd apps/api
            timeout 8 node dist/index.js || true
            exit 1
          fi
          echo
          echo "Prod health OK"

          echo "=== Restart staging API ==="
          if [ -d /var/www/mawjood-staging ]; then
            cd /var/www/mawjood-staging
            pm2 delete mawjood-api-staging || true
            pm2 start deploy/ecosystem.staging.config.cjs
            sleep 3
            curl -fsS http://127.0.0.1:4001/api/v1/health || true
            echo
          fi

          pm2 save
          pm2 status
          cd /var/www/abualnus/apps/api
          node -e "require('dotenv').config(); console.log('meps configured:', !!(process.env.PAYTABS_PROFILE_ID && process.env.PAYTABS_SERVER_KEY));"
          echo FIX_DONE
          REMOTE
