# Shared security headers for MawJooD SPA + API frontends (Visa / PCI hygiene)
#
# Include from site configs after Certbot SSL is in place, e.g.:
#   include /var/www/abualnus/deploy/nginx/snippets/security-headers.conf;
#
# Or paste into location / blocks.

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
# HSTS — only on HTTPS server blocks
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
