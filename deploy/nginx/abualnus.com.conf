# Storefront — abualnus.com + www
# Certbot will inject SSL listen blocks.

server {
    listen 80;
    listen [::]:80;
    server_name abualnus.com www.abualnus.com;

    client_max_body_size 12m;

    # ACME challenges (Certbot)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # API proxy (storefront uses relative /api/v1)
    location /api/ {
        proxy_pass http://abualnus_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # PayTabs POSTs to return URL; SPA would 405. POST → API bridge; GET → SPA.
    location = /checkout/meps/return {
        error_page 418 = @paytabs_return_post;
        if ($request_method = POST) {
            return 418;
        }
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location @paytabs_return_post {
        proxy_pass http://abualnus_api/api/v1/checkout/meps/return;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    root /var/www/abualnus/apps/storefront/dist;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
