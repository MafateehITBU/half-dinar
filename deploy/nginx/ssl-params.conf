# SSL / TLS — PCI & payment-gateway KYC
#
# Required on the VPS:
# - TLS 1.0 and 1.1 DISABLED
# - TLS 1.2 and 1.3 only
#
# Applied in:
# - /etc/nginx/nginx.conf → ssl_protocols TLSv1.2 TLSv1.3;
# - /etc/letsencrypt/options-ssl-nginx.conf (Certbot)
#
# After Certbot renewals, confirm options-ssl-nginx.conf still has TLSv1.2 TLSv1.3 only.

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
